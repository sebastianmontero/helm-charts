apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conversational-rag-server.fullname" . }}
  labels:
    {{- include "conversational-rag-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: "{{ .Values.env.openaiApiKey }}"
  PINECONE_API_KEY: "{{ .Values.env.pineconeApiKey }}"
  COHERE_API_KEY: "{{ .Values.env.cohereApiKey }}"
  LANGCHAIN_API_KEY: "{{ .Values.env.langchainApiKey }}"
  GROQ_API_KEY: "{{ .Values.env.groqApiKey }}"
