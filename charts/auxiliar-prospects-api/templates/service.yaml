apiVersion: v1
kind: Service
metadata:
  name: {{ include "auxiliar-prospects-api.fullname" . }}
  labels:
    {{- include "auxiliar-prospects-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "auxiliar-prospects-api.selectorLabels" . | nindent 4 }}
