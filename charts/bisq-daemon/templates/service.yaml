apiVersion: v1
kind: Service
metadata:
  name: {{ include "bisq-daemon.fullname" . }}
  labels:
    {{- include "bisq-daemon.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9998
      targetPort: grpc  
      protocol: TCP
      name: grpc
  selector:
    {{- include "bisq-daemon.selectorLabels" . | nindent 4 }}
