apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bisq-daemon.fullname" . }}
  labels:
    {{- include "bisq-daemon.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bisq-daemon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bisq-daemon.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["java", "-jar", "bisq-daemon/daemon.jar", "--apiPassword=p123"]
          ports:
            - name: grpc
              containerPort: 9998
              protocol: TCP
          livenessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              # Ensure 'p123' matches the apiPassword. Consider using a Helm value.
              # The service/method pb.GetVersion/GetVersion is based on Bisq documentation.
              - "java -jar bisq-cli/cli.jar --password=p123 getversion"
            initialDelaySeconds: 60 # Time to wait before the first probe
            periodSeconds: 30       # How often to perform the probe
            timeoutSeconds: 10        # When the probe times out
            failureThreshold: 3       # How many failures before marking unhealthy/restarting
            successThreshold: 1       # Minimum consecutive successes to be considered healthy
          readinessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              # Ensure 'p123' matches the apiPassword. Consider using a Helm value.
              # The service/method pb.Wallets/GetTxFeeRate is based on Bisq documentation.
              - "java -jar bisq-cli/cli.jar --password=p123 gettxfeerate"
            initialDelaySeconds: 30 # Time to wait before the first probe
            periodSeconds: 20       # How often to perform the probe
            timeoutSeconds: 10        # When the probe times out
            failureThreshold: 3       # How many failures before marking unready
            successThreshold: 1       # Minimum consecutive successes to be considered ready
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
