# Default values for conversational-rag-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: sebastianmontero/conversational-rag-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: c5cd20657a349551eb15679ec233ad92c12b54c8

url:
  domain: 
    base: ""
    subdomain: ""


env:
  openaiApiKey: ""
  qdrantApiKey: ""
  qdrantClusterUrl: ""
  langchainApiKey: ""
  langchainTracingV2: "False"
  langchainProject: ""
  langchainEndpoint: "https://api.smith.langchain.com"


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000


ingress:
  enabled: true

resources: 
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
